name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline self-checks (parser fixtures, patch application, syntax)
        run: node --experimental-strip-types scripts/smoke.mjs
      - name: Package manifests are publishable
        run: npm pack --dry-run --workspaces
